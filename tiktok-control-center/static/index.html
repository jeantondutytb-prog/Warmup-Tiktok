<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Control Center</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>TikTok Control Center</h1>
      <p class="subtitle">Warmup de comptes iOS — simulation comportement humain</p>
    </header>

    <section class="card status-card">
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Chargement...</span>
      </div>
    </section>

    <section class="card">
      <h2>Lancer une session</h2>
      <form id="startForm">
        <div class="field">
          <label for="profile">Profil de warmup</label>
          <select id="profile" name="profile"></select>
          <p class="hint" id="profileDesc"></p>
        </div>
        <div class="field">
          <label for="duration">Durée (minutes, 0 = défaut du profil)</label>
          <input type="number" id="duration" name="duration" value="0" min="0" max="120">
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="startBtn">Démarrer</button>
          <button type="button" class="btn btn-danger" id="stopBtn" disabled>Arrêter</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Profils disponibles</h2>
      <div id="profilesList" class="profiles-grid"></div>
    </section>

    <section class="card">
      <h2>Historique des sessions</h2>
      <div id="sessionsList" class="sessions-list"></div>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
